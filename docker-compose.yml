version: '3.8'

services:
  web:
    # Substitua 'seu-usuario' pelo seu nome de usuário no Docker Hub
    image: wescleymacedosousa/skote-angular-vertical:latest
    container_name: skote_angular_app
    restart: always
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
