server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Habilita compressão Gzip para otimizar a velocidade de download dos assets
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  location / {
    # Tenta servir o arquivo requisitado diretamente, caso não encontre, redireciona para index.html
    try_files $uri $uri/ /index.html;
  }

  # Configuração de cache para arquivos estáticos (JS, CSS, Imagens)
  location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
    expires 6m;
    add_header Cache-Control "public, max-age=15552000, immutable";
  }

  # Trata erros do servidor
  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }

}
